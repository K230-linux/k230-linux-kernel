%YAML 1.2
---
$id: http://devicetree.org/schemas/display/canaan,k230-mipi-dsi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Canaan K230 MIPI-DSI Host Controller

maintainers:
  - Sungjoon Moon <sumoon@seoulsaram.org>

description:
  The Canaan K230 MIPI-DSI host controller converts parallel display data
  from the K230 Video Output controller into MIPI-DSI signals. It can drive
  a MIPI-DSI panel directly or connect to an external bridge such as the
  Lontium LT9611 DSI-to-HDMI converter.

allOf:
  - $ref: dsi-controller.yaml#

properties:
  compatible:
    const: canaan,k230-mipi-dsi

  reg:
    maxItems: 1

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: pclk
      - const: pixel
    description:
      pclk is the DSI host APB clock consumed by the DW MIPI DSI library;
      pixel is the display pixel clock consumed by the K230 glue.

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

    properties:
      port@0:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Input port receiving data from the Video Output controller.

      port@1:
        $ref: /schemas/graph.yaml#/properties/port
        description:
          Output port connecting to a DSI panel or bridge.

    required:
      - port@0
      - port@1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - ports

unevaluatedProperties: false

examples:
  - |
    dsi@90850000 {
        compatible = "canaan,k230-mipi-dsi";
        reg = <0x90850000 0x1000>;
        clocks = <&clk 0>, <&clk 1>;
        clock-names = "pclk", "pixel";
        #address-cells = <1>;
        #size-cells = <0>;

        ports {
            #address-cells = <1>;
            #size-cells = <0>;

            port@0 {
                reg = <0>;
                dsi_in: endpoint {
                    remote-endpoint = <&vo_out>;
                };
            };

            port@1 {
                reg = <1>;
                dsi_out: endpoint {
                    remote-endpoint = <&bridge_in>;
                };
            };
        };
    };

...
