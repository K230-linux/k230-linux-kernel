%YAML 1.2
---
$id: http://devicetree.org/schemas/display/canaan,display-subsystem.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Canaan K230 DRM master device

maintainers:
  - Sungjoon Moon <sumoon@seoulsaram.org>

description:
  The Canaan K230 DRM master device is a virtual device needed to list all
  display controller nodes that comprise the graphics subsystem.

properties:
  compatible:
    const: canaan,display-subsystem

  ports:
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      maxItems: 1
    description:
      List of phandles pointing to output ports of the display controller.

required:
  - compatible
  - ports

additionalProperties: false

examples:
  - |
    display-subsystem {
        compatible = "canaan,display-subsystem";
        ports = <&vo_out>;
    };

...
